services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paperbuddy
      POSTGRES_USER: paperbuddy
      POSTGRES_PASSWORD: paperbuddy
    ports:
      - "5432:5432"
    volumes:
      - paperbuddy_postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    depends_on:
      - postgres
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  paperbuddy_postgres:
