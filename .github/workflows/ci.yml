name: PaperBuddy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://paperbuddy:paperbuddy@localhost:5432/paperbuddy?schema=public
      JWT_SECRET: paperbuddy-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - name: Lint frontend
        run: npm -w frontend run lint
      - name: Typecheck backend
        run: npm -w backend run lint
      - name: Build frontend
        run: npm -w frontend run build
      - name: Build backend
        run: npm -w backend run build
